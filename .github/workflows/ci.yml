name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Run complete offline acceptance from empty caches
        run: python3 -B Scripts/Conformance/ci.py --output .build/ci-evidence
      - name: Preserve acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-conformance-${{ github.sha }}-${{ github.run_attempt }}
          path: .build/ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
